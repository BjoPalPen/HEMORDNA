<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A6C8C" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C2024" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Ett enklare hem, en lugnare vardag." />
    <title>Hemordna</title>
    <base href="/" />
    <!-- Applies a forced light/dark choice (Support/Theme.cs, wwwroot/js/theme.js) and
         "Lugnare skärm" (Support/CalmScreen.cs, wwwroot/js/calm-screen.js) before app.css
         loads, so there is no flash of the wrong theme or of motion/blur on first paint. Keep
         the storage keys and attribute logic here in sync with theme.js/calm-screen.js if
         either changes. -->
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('hemordna.theme');
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
                if (localStorage.getItem('hemordna.calm') === '1') {
                    document.documentElement.setAttribute('data-calm', '');
                }
            } catch (e) {}

            // Bakgrundsbild (Support/Backdrop.cs, wwwroot/js/backdrop.js) - unlike theme/calm
            // above, reading the photo out of IndexedDB is inherently async, so it cannot be
            // applied before app.css loads without blocking first paint. Best effort instead:
            // kick off the read now and apply as soon as it resolves, so the photo shows up as
            // early as possible rather than waiting for Blazor itself to boot. The plain --kalk
            // body background stays visible underneath until then, so nothing flashes wrong.
            // Keep the database/store/key names here in sync with backdrop.js if they change.
            import('./js/backdrop.js').then(function (module) {
                return module.apply();
            }).catch(function () {});
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link href="Hemordna.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <img src="brand/logo.png" alt="" width="64" height="64" />
            <p>Hemordna</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Något gick fel.
        <a href="." class="reload">Ladda om</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/webauthn.js"></script>
    <script>navigator.serviceWorker?.register('service-worker.js');</script>
</body>

</html>
